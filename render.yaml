# Render Blueprint: Dashboard → New → Blueprint → pick this repo.
# The Touch Grass website as a free static site (no card needed). The AI runs in the
# visitor's browser, or on the Hermes 3 server (server/, deployed to Hugging Face Spaces).
services:
  - type: web
    name: touchgrass
    runtime: static
    buildCommand: mkdir -p dist && cp -r index.html sw.js manifest.webmanifest css js icons dist/
    staticPublishPath: ./dist
    headers:
      - path: /sw.js
        name: Cache-Control
        value: no-cache
      - path: /index.html
        name: Cache-Control
        value: no-cache
