# Bot + local Ollama in one command:  docker compose up -d
# The first start downloads the model (~3 GB for gemma3:4b).
services:
  ollama:
    image: ollama/ollama
    volumes:
      - ollama:/root/.ollama
    restart: unless-stopped
    # Pull the model on start, then keep serving.
    entrypoint: ["/bin/sh", "-c", "ollama serve & sleep 3 && ollama pull ${OLLAMA_MODEL:-gemma3:4b} && wait"]

  bot:
    build: .
    env_file: .env
    environment:
      OLLAMA_URL: http://ollama:11434
    volumes:
      - ./data:/app/data
    depends_on:
      - ollama
    restart: unless-stopped

volumes:
  ollama:
